[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamcode-agent-cli"
version = "0.1.0"
description = "TeamCode Agent CLI（C-3：拉取接口文档 / MCP server）"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[project.optional-dependencies]
watch = ["watchdog>=4.0,<7.0"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "watchdog>=4.0,<7.0",
]

[project.scripts]
# C-3：安装后即可执行 teamcode pull-interfaces
teamcode = "cli.teamcode:main"

[tool.setuptools]
packages = [
  "cli",
  "app",
  "app.agent_runtime",
  "app.api",
  "app.git_ops",
  "app.interface_registry",
  "app.manager_agent",
  "app.models",
  "app.realtime",
  "app.schemas",
  "app.security",
]

[tool.setuptools.package-dir]
cli = "cli"
app = "backend/app"
