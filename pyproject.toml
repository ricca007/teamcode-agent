[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamcode-agent-cli"
version = "0.1.0"
description = "TeamCode Agent CLI（C-3：拉取接口文档 / MCP server）"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
watch = ["watchdog>=4.0,<7.0"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
  "watchdog>=4.0,<7.0",
]

[project.scripts]
# C-3：安装后即可执行 teamcode pull-interfaces
teamcode = "cli.teamcode:main"

[tool.setuptools]
packages = ["cli"]

[tool.setuptools.package-dir]
cli = "cli"
