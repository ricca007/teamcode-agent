services:
  api:
    build:
      context: ./backend
    command: >
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://teamcode:teamcode@db:5432/teamcode}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamcode}
      POSTGRES_USER: ${POSTGRES_USER:-teamcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamcode}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamcode} -d ${POSTGRES_DB:-teamcode}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
